name: CI
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: 'npm'
    - run: npm ci
    - run: npm run content
    - run: npx next typegen 
    - run: npx tsc --noEmit
    - run: npm run lint
    - run: npm run test:run
    - run: npm run build
